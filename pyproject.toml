[project]
name = "radio"
version = "0.1.0"
requires-python = ">=3.11,<3.13"  # lgpio has aarch64 wheels only up to cp312
dependencies = [
    "python-mpd2",
    "mutagen",
    "python-dotenv",
    "psutil",
    "gpiozero; sys_platform == 'linux'",
    "lgpio; sys_platform == 'linux'",
    "pyserial>=3.5",
]
